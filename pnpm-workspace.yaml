packages:
  - packages/*

# Transitive dependencies of the Pi host packages ship postinstall scripts that
# this repo does not need. Deny them explicitly so installs stay script-free.
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false

# Native release management (docs/releases.md): agent-authored change intents in
# .changeset/, local `pnpm version -r` preparation, committed per-package
# CHANGELOG.md files, and the consumption ledger .changeset/ledger.yaml.
# Plugins version independently; the private workspace root never releases.
versioning:
  ignore:
    - pi-extensions
  changelog:
    storage: repository
