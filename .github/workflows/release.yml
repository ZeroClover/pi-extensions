# Publishes the prepared release batch of one reviewed integration commit
# (docs/releases.md). It never versions, composes notes, or selects packages:
# the batch is the release records new in that commit relative to its first
# parent. Tags are written after publication and never trigger this workflow.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Recovery only - the original release integration commit (docs/releases.md)
        required: true
        type: string

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Require the default branch's workflow
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Releases run only from the default branch's workflow."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        name: Read the release batch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = push ]; then
            node tools/release/src/cli.ts plan --event push --before "$BEFORE" --after "$AFTER" \
              --forced "$FORCED" --repo "$REPO" --default-branch "$DEFAULT_BRANCH"
          else
            node tools/release/src/cli.ts plan --event dispatch --source "$SOURCE_SHA" \
              --repo "$REPO" --default-branch "$DEFAULT_BRANCH"
          fi

  verify:
    name: Verify artifacts
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the release commit
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Check the release commit
        working-directory: source
        run: |
          pnpm check
          pnpm change check
      - name: Pack, inspect, and load every batch member
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts" "$RUNNER_TEMP/release-work"
          node tools/release/src/cli.ts verify --source "$SOURCE_SHA" --source-dir source \
            --out "$RUNNER_TEMP/release-artifacts" --work-dir "$RUNNER_TEMP/release-work"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-batch
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # One publication at a time; an active upload is never cancelled.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-batch
          path: ${{ runner.temp }}/release-artifacts
      - name: Authorize, publish, tag, and announce
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node tools/release/src/cli.ts publish --source "$SOURCE_SHA" --artifacts "$RUNNER_TEMP/release-artifacts" \
            --repo "$REPO" --default-branch "$DEFAULT_BRANCH"
